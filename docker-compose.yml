services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      # Elasticvue (http://localhost:8080) talks to ES straight from the browser.
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8080
      - http.cors.allow-headers=X-Requested-With,Content-Type,Content-Length,Authorization
    ports:
      # Security is disabled, so only this machine may reach ES -- not the whole LAN.
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      # Read from .env (see .env.example); the fallbacks are local-development defaults.
      POSTGRES_USER: ${POSTGRES_USER:-docqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docqa}
      POSTGRES_DB: ${POSTGRES_DB:-docqa}
    ports:
      # Host port 55432, not 5432: a PostgreSQL installed directly on the machine
      # usually holds 5432 already. Change with POSTGRES_PORT (and DATABASE_URL).
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  esdata:
    name: document-qa-esdata
  pgdata:
    name: document-qa-pgdata
